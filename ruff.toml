exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 100

target-version = "py311"

select = ["ALL"]
ignore = [
    "INP001",
    "D",
    "F821",
    "TRY300",
    "RET505",
    "FLY002",
]

fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"